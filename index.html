<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planning 2026 - Accueil</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Navigation -->
        <div class="nav-tabs">
            <a href="index.html" class="active">⚙️ Paramètres</a>
            <a href="pages/bilan.html">📊 Bilan</a>
            <a href="pages/mois.html?mois=janvier">📅 Janv</a>
            <a href="pages/mois.html?mois=fevrier">📅 Fév</a>
            <a href="pages/mois.html?mois=mars">📅 Mar</a>
            <a href="pages/mois.html?mois=avril">📅 Avr</a>
            <a href="pages/mois.html?mois=mai">📅 Mai</a>
            <a href="pages/mois.html?mois=juin">📅 Juin</a>
            <a href="pages/mois.html?mois=juillet">📅 Juil</a>
            <a href="pages/mois.html?mois=aout">📅 Août</a>
            <a href="pages/mois.html?mois=septembre">📅 Sep</a>
            <a href="pages/mois.html?mois=octobre">📅 Oct</a>
            <a href="pages/mois.html?mois=novembre">📅 Nov</a>
            <a href="pages/mois.html?mois=decembre">📅 Déc</a>
        </div>

        <!-- Contenu -->
        <div class="panel">
            <div class="panel-header">
                <h2>⚙️ Paramètres du Planning</h2>
            </div>

            <div class="config-section">
                <div class="config-grid">
                    <div>
                        <label>Année</label>
                        <input type="number" id="anneeInput" value="2026" step="1" min="2020" max="2040">
                    </div>
                    <div>
                        <label>Club</label>
                        <input type="text" id="clubInput" value="ASPTT Voile">
                    </div>
                    <div class="full-width">
                        <label>Moniteurs (séparés par des virgules)</label>
                        <input type="text" id="staffInput" 
                               value="Romain, Thibau, James, Swann, Soen, Cenzo, Marine, Léa, Erwan, Marin, Marie, Nils, Florian, Iris, Mael">
                    </div>
                    <div class="full-width">
                        <label>Activités (une par ligne)</label>
                        <textarea id="activitesInput">ACCUEIL
EDV
EDS
ATELIER
GROUPE
CP
LOCATION
REPOS
REUNION
SCOLAIRE
AUTRE
RTQ
RTQ+EDS
EDV+CP
ATELIER+CP
GROUPE+CP
ACCUEIL+CP
EDV+GP
EDS+AT
ATELIER+GP
GROUPE+AT
CONGES
SCOLAIRE+CP</textarea>
                    </div>
                </div>
                <div class="config-actions">
                    <button class="btn" onclick="saveConfig()">💾 Enregistrer</button>
                    <button class="btn btn-outline" onclick="resetConfig()">🔄 Réinitialiser</button>
                    <button class="btn btn-outline btn-danger" onclick="resetAllData()">🗑️ Effacer les données</button>
                    <span class="status-save" id="saveStatus">✅ Sauvegarde automatique activée</span>
                </div>
            </div>

            <div style="margin-top: 30px;">
                <h3 style="font-size:0.9rem; color:#475569; margin-bottom:12px;">Accès rapide par mois :</h3>
                <div class="month-grid" id="monthGrid"></div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/app.js"></script>
    <script>
        // Charger la configuration
        let config = PlanningApp.loadConfig();
        let data = PlanningApp.loadData(config);

        // Remplir le formulaire
        function loadConfigToForm() {
            document.getElementById('anneeInput').value = config.year || 2026;
            document.getElementById('clubInput').value = config.club || 'ASPTT Voile';
            document.getElementById('staffInput').value = config.staff?.join(', ') || '';
            document.getElementById('activitesInput').value = config.activities?.join('\n') || '';
        }

        // Sauvegarder la configuration
        function saveConfig() {
            config.year = parseInt(document.getElementById('anneeInput').value) || 2026;
            config.club = document.getElementById('clubInput').value || 'ASPTT Voile';
            config.staff = document.getElementById('staffInput').value
                .split(',')
                .map(s => s.trim())
                .filter(s => s);
            config.activities = document.getElementById('activitesInput').value
                .split('\n')
                .map(s => s.trim())
                .filter(s => s);

            PlanningApp.saveConfig(config);
            
            // Recharger les données pour la nouvelle année/staff
            data = PlanningApp.generateYearData(config);
            PlanningApp.saveData(data);
            
            document.getElementById('saveStatus').textContent = '✅ Paramètres enregistrés';
            setTimeout(() => {
                document.getElementById('saveStatus').textContent = '✅ Sauvegarde automatique activée';
            }, 2000);
            
            alert('Paramètres enregistrés !');
        }

        // Réinitialiser la configuration
        function resetConfig() {
            if (confirm('Réinitialiser les paramètres ?')) {
                config = { ...PlanningApp.DEFAULT_CONFIG };
                PlanningApp.saveConfig(config);
                loadConfigToForm();
                alert('Paramètres réinitialisés.');
            }
        }

        // Réinitialiser toutes les données
        function resetAllData() {
            if (confirm('Effacer TOUTES les données saisies ?')) {
                data = PlanningApp.generateYearData(config);
                PlanningApp.saveData(data);
                alert('Données effacées.');
                location.reload();
            }
        }

        // Générer les liens vers les mois
        function generateMonthLinks() {
            const grid = document.getElementById('monthGrid');
            grid.innerHTML = '';
            
            PlanningApp.MONTHS.forEach((key, i) => {
                const a = document.createElement('a');
                a.href = `pages/mois.html?mois=${key}`;
                a.textContent = PlanningApp.MONTH_LABELS[i];
                grid.appendChild(a);
            });
        }

        // Initialisation
        loadConfigToForm();
        generateMonthLinks();
    </script>
</body>
</html>
