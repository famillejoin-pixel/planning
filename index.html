<!-- ============ index.html ============ -->
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planning 2026 - Paramètres</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .index-container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }
        .index-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .index-header h1 {
            font-size: 2rem;
            color: #1e293b;
        }
        .index-header p {
            color: #64748b;
        }
        .nav-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .nav-card {
            background: white;
            border: 1px solid #e9edf2;
            border-radius: 12px;
            padding: 24px 20px;
            text-align: center;
            text-decoration: none;
            color: #1e293b;
            transition: 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .nav-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            border-color: #1e293b;
        }
        .nav-card .icon {
            font-size: 2.5rem;
            display: block;
            margin-bottom: 10px;
        }
        .nav-card h3 {
            font-size: 1rem;
            margin-bottom: 6px;
        }
        .nav-card p {
            font-size: 0.8rem;
            color: #64748b;
        }
        .month-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
            margin-top: 20px;
        }
        .month-grid a {
            background: #f8fafc;
            border: 1px solid #e9edf2;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            text-decoration: none;
            color: #1e293b;
            font-size: 0.85rem;
            transition: 0.15s;
        }
        .month-grid a:hover {
            background: #1e293b;
            color: white;
            border-color: #1e293b;
        }
        .config-section {
            margin-top: 40px;
            background: #f8fafc;
            border-radius: 12px;
            padding: 24px;
        }
        .config-section h3 {
            font-size: 1rem;
            margin-bottom: 16px;
        }
        .config-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .config-grid label {
            font-weight: 600;
            font-size: 0.8rem;
            display: block;
            margin-bottom: 4px;
        }
        .config-grid input,
        .config-grid textarea {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #d1d9e6;
            border-radius: 6px;
            font-family: inherit;
        }
        .config-grid textarea {
            resize: vertical;
            min-height: 100px;
        }
        .config-actions {
            margin-top: 16px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }
        .btn {
            background: #1e293b;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-outline {
            background: transparent;
            border: 1.5px solid #1e293b;
            color: #1e293b;
        }
        .btn-outline:hover {
            background: #1e293b;
            color: white;
        }
        .btn-danger {
            border-color: #b42318 !important;
            color: #b42318 !important;
        }
        .btn-danger:hover {
            background: #b42318 !important;
            color: white !important;
        }
        .btn:hover {
            opacity: 0.85;
        }
        .status-save {
            font-size: 0.8rem;
            color: #087443;
            font-weight: 600;
            margin-left: 8px;
        }
        .full-width {
            grid-column: 1 / -1;
        }
        @media (max-width: 700px) {
            .config-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="index-container">
        <div class="index-header">
            <h1>⛵ Planning 2026</h1>
            <p>Gestion des plannings et suivi des heures moniteurs</p>
        </div>

        <div class="nav-cards">
            <a href="pages/bilan.html" class="nav-card">
                <span class="icon">📊</span>
                <h3>Bilan annuel</h3>
                <p>Vue d'ensemble des heures et graphiques</p>
            </a>
            <a href="pages/mois.html?mois=janvier" class="nav-card">
                <span class="icon">📅</span>
                <h3>Planning mensuel</h3>
                <p>Saisie des heures par moniteur</p>
            </a>
        </div>

        <div style="margin-top: 30px;">
            <h3 style="font-size:0.9rem; color:#475569; margin-bottom:12px;">Accès rapide par mois :</h3>
            <div class="month-grid" id="monthGrid"></div>
        </div>

        <div class="config-section">
            <h3>⚙️ Paramètres généraux</h3>
            <div class="config-grid">
                <div>
                    <label>Année</label>
                    <input type="number" id="anneeInput" value="2026" step="1" min="2020" max="2040">
                </div>
                <div>
                    <label>Club</label>
                    <input type="text" id="clubInput" value="ASPTT Voile">
                </div>
                <div class="full-width">
                    <label>Moniteurs (séparés par des virgules)</label>
                    <input type="text" id="staffInput" value="Romain, Thibau, James, Swann, Soen, Cenzo, Marine, Léa, Erwan, Marin, Marie, Nils, Florian, Iris, Mael">
                </div>
                <div class="full-width">
                    <label>Activités (une par ligne)</label>
                    <textarea id="activitesInput">ACCUEIL
EDV
EDS
ATELIER
GROUPE
CP
LOCATION
REPOS
REUNION
SCOLAIRE
AUTRE
RTQ
RTQ+EDS
EDV+CP
ATELIER+CP
GROUPE+CP
ACCUEIL+CP
EDV+GP
EDS+AT
ATELIER+GP
GROUPE+AT
CONGES
SCOLAIRE+CP</textarea>
                </div>
            </div>
            <div class="config-actions">
                <button class="btn" id="saveConfigBtn">💾 Enregistrer</button>
                <button class="btn btn-outline" id="resetConfigBtn">↺ Réinitialiser</button>
                <button class="btn btn-outline btn-danger" id="resetDataBtn">🗑️ Effacer les données</button>
                <span class="status-save" id="saveStatus">✓ Sauvegarde automatique activée</span>
            </div>
        </div>
    </div>

    <script>
        // -------- Gestion des paramètres --------
        function loadConfig() {
            try {
                const saved = localStorage.getItem('planning2026_config');
                if (saved) {
                    const cfg = JSON.parse(saved);
                    if (cfg.annee) document.getElementById('anneeInput').value = cfg.annee;
                    if (cfg.club) document.getElementById('clubInput').value = cfg.club;
                    if (cfg.staff) document.getElementById('staffInput').value = cfg.staff;
                    if (cfg.activites) document.getElementById('activitesInput').value = cfg.activites;
                }
            } catch(e) {}
        }

        function saveConfig() {
            const cfg = {
                annee: document.getElementById('anneeInput').value,
                club: document.getElementById('clubInput').value,
                staff: document.getElementById('staffInput').value,
                activites: document.getElementById('activitesInput').value
            };
            localStorage.setItem('planning2026_config', JSON.stringify(cfg));
            const status = document.getElementById('saveStatus');
            status.textContent = '✓ Paramètres enregistrés';
            setTimeout(() => status.textContent = '✓ Sauvegarde automatique activée', 2000);
            alert('Paramètres enregistrés !');
        }

        function resetConfig() {
            localStorage.removeItem('planning2026_config');
            document.getElementById('anneeInput').value = '2026';
            document.getElementById('clubInput').value = 'ASPTT Voile';
            document.getElementById('staffInput').value = 'Romain, Thibau, James, Swann, Soen, Cenzo, Marine, Léa, Erwan, Marin, Marie, Nils, Florian, Iris, Mael';
            document.getElementById('activitesInput').value = `ACCUEIL
EDV
EDS
ATELIER
GROUPE
CP
LOCATION
REPOS
REUNION
SCOLAIRE
AUTRE
RTQ
RTQ+EDS
EDV+CP
ATELIER+CP
GROUPE+CP
ACCUEIL+CP
EDV+GP
EDS+AT
ATELIER+GP
GROUPE+AT
CONGES
SCOLAIRE+CP`;
            alert('Paramètres réinitialisés.');
        }

        document.getElementById('saveConfigBtn').addEventListener('click', saveConfig);
        document.getElementById('resetConfigBtn').addEventListener('click', resetConfig);
        document.getElementById('resetDataBtn').addEventListener('click', function() {
            if (confirm('Effacer TOUTES les données saisies ?')) {
                localStorage.removeItem('planning2026_data');
                alert('Données effacées.');
                location.reload();
            }
        });

        // Génération des liens vers les mois
        const monthLabels = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
        const monthKeys = ['janvier','fevrier','mars','avril','mai','juin','juillet','aout','septembre','octobre','novembre','decembre'];
        const grid = document.getElementById('monthGrid');
        monthKeys.forEach((key, i) => {
            const a = document.createElement('a');
            a.href = `pages/mois.html?mois=${key}`;
            a.textContent = monthLabels[i];
            grid.appendChild(a);
        });

        loadConfig();
    </script>
</body>
</html>
