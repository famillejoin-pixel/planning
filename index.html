<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planning 2026 - Paramètres</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Navigation -->
        <div class="nav-tabs">
            <a href="index.html" class="active">⚙️ Paramètres</a>
            <a href="pages/bilan.html">📊 Bilan</a>
            <a href="pages/mois.html?mois=janvier">📅 Janv</a>
            <a href="pages/mois.html?mois=fevrier">📅 Fév</a>
            <a href="pages/mois.html?mois=mars">📅 Mar</a>
            <a href="pages/mois.html?mois=avril">📅 Avr</a>
            <a href="pages/mois.html?mois=mai">📅 Mai</a>
            <a href="pages/mois.html?mois=juin">📅 Juin</a>
            <a href="pages/mois.html?mois=juillet">📅 Juil</a>
            <a href="pages/mois.html?mois=aout">📅 Août</a>
            <a href="pages/mois.html?mois=septembre">📅 Sep</a>
            <a href="pages/mois.html?mois=octobre">📅 Oct</a>
            <a href="pages/mois.html?mois=novembre">📅 Nov</a>
            <a href="pages/mois.html?mois=decembre">📅 Déc</a>
        </div>

        <!-- Contenu -->
        <div class="panel">
            <div class="panel-header">
                <h2>⚙️ Paramètres généraux</h2>
            </div>

            <div class="config-section">
                <div class="config-grid">
                    <div>
                        <label>Année</label>
                        <input type="number" id="anneeInput" value="2026" step="1" min="2020" max="2040">
                    </div>
                    <div>
                        <label>Club</label>
                        <input type="text" id="clubInput" value="ASPTT Voile">
                    </div>
                    <div class="full-width">
                        <label>Moniteurs (séparés par des virgules)</label>
                        <input type="text" id="staffInput" value="Romain, Thibau, James, Swann, Soen, Cenzo, Marine, Léa, Erwan, Marin, Marie, Nils, Florian, Iris, Mael">
                    </div>
                    <div class="full-width">
                        <label>Activités (une par ligne)</label>
                        <textarea id="activitesInput">ACCUEIL
EDV
EDS
ATELIER
GROUPE
CP
LOCATION
REPOS
REUNION
SCOLAIRE
AUTRE
RTQ
RTQ+EDS
EDV+CP
ATELIER+CP
GROUPE+CP
ACCUEIL+CP
EDV+GP
EDS+AT
ATELIER+GP
GROUPE+AT
CONGES
SCOLAIRE+CP</textarea>
                    </div>
                </div>
                <div class="config-actions">
                    <button class="btn" id="saveConfigBtn">💾 Enregistrer</button>
                    <button class="btn btn-outline" id="resetConfigBtn">🔄 Réinitialiser</button>
                    <button class="btn btn-outline btn-danger" id="resetDataBtn">🗑️ Effacer les données</button>
                    <span class="status-save" id="saveStatus">✅ Sauvegarde automatique activée</span>
                </div>
            </div>

            <div style="margin-top: 30px;">
                <h3 style="font-size:0.9rem; color:#475569; margin-bottom:12px;">Accès rapide par mois :</h3>
                <div class="month-grid" id="monthGrid"></div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/app.js"></script>
    <script>
        // --- LOGIQUE DE LA PAGE INDEX ---
        
        // Générer les liens vers les mois
        function generateMonthLinks() {
            const grid = document.getElementById('monthGrid');
            grid.innerHTML = '';
            
            MONTHS.forEach((key, i) => {
                const a = document.createElement('a');
                a.href = `pages/mois.html?mois=${key}`;
                a.textContent = MONTH_LABELS[i];
                grid.appendChild(a);
            });
        }
        
        // Charger la configuration dans le formulaire
        function loadConfigToForm() {
            document.getElementById('anneeInput').value = App.config.year || 2026;
            document.getElementById('clubInput').value = App.config.club || 'ASPTT Voile';
            document.getElementById('staffInput').value = App.config.staff?.join(', ') || '';
            document.getElementById('activitesInput').value = App.config.activities?.join('\n') || '';
        }
        
        // Sauvegarder la configuration depuis le formulaire
        function saveConfigFromForm() {
            App.config.year = parseInt(document.getElementById('anneeInput').value) || 2026;
            App.config.club = document.getElementById('clubInput').value || 'ASPTT Voile';
            App.config.staff = document.getElementById('staffInput').value
                .split(',')
                .map(s => s.trim())
                .filter(s => s);
            App.config.activities = document.getElementById('activitesInput').value
                .split('\n')
                .map(s => s.trim())
                .filter(s => s);
            
            App.saveConfig();
            
            // Recharger les données pour le nouveau staff/année
            App.data = App.generateYearData();
            App.saveData(false);
            
            const status = document.getElementById('saveStatus');
            status.textContent = '✅ Paramètres enregistrés';
            setTimeout(() => {
                status.textContent = '✅ Sauvegarde automatique activée';
            }, 2000);
            
            alert('Paramètres enregistrés !');
        }
        
        // Réinitialiser la configuration
        function resetConfig() {
            if (confirm('Réinitialiser les paramètres ?')) {
                App.config = { ...App.config, ...{
                    year: 2026,
                    club: 'ASPTT Voile',
                    staff: ['Romain', 'Thibau', 'James', 'Swann', 'Soen', 'Cenzo', 'Marine', 'Léa', 'Erwan', 'Marin', 'Marie', 'Nils', 'Florian', 'Iris', 'Mael'],
                    activities: [
                        'ACCUEIL', 'EDV', 'EDS', 'ATELIER', 'GROUPE', 'CP', 'LOCATION', 'REPOS', 'REUNION', 
                        'SCOLAIRE', 'AUTRE', 'RTQ', 'RTQ+EDS', 'EDV+CP', 'ATELIER+CP', 'GROUPE+CP', 
                        'ACCUEIL+CP', 'EDV+GP', 'EDS+AT', 'ATELIER+GP', 'GROUPE+AT', 'CONGES', 'SCOLAIRE+CP'
                    ]
                }};
                App.saveConfig();
                loadConfigToForm();
                alert('Paramètres réinitialisés.');
            }
        }
        
        // Réinitialiser toutes les données
        function resetAllData() {
            if (confirm('Effacer TOUTES les données saisies ?')) {
                App.resetAllData();
                alert('Données effacées.');
                location.reload();
            }
        }
        
        // Attacher les événements
        document.getElementById('saveConfigBtn').addEventListener('click', saveConfigFromForm);
        document.getElementById('resetConfigBtn').addEventListener('click', resetConfig);
        document.getElementById('resetDataBtn').addEventListener('click', resetAllData);
        
        // Initialisation
        App.init().then(() => {
            loadConfigToForm();
            generateMonthLinks();
        });
    </script>
</body>
</html>
