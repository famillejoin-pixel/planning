<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planning - Mois</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        /* Styles spécifiques pour ce fichier */
        .hour-select { width: 60px; padding: 4px; font-size: 0.8rem; text-align: center; }
        .activity-select { width: 100px; padding: 4px; font-size: 0.75rem; }
        .diff-cell { font-weight: bold; min-width: 35px; display: inline-block; padding: 2px 6px; border-radius: 3px; }
        .diff-positive { color: #27ae60; background: rgba(39, 174, 96, 0.1); }
        .diff-negative { color: #e74c3c; background: rgba(231, 76, 60, 0.1); }
        .diff-zero { color: #f39c12; background: rgba(243, 156, 18, 0.1); }
        .dimanche-row td { background: #fdecea; }
        .month-header td { background: #f0f3f5; font-weight: bold; border-top: 2px solid #3498db; }
        .total-row td { background: #e8f4fc; font-weight: bold; border-top: 2px solid #3498db; }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Navigation -->
        <div class="nav-tabs">
            <a href="../index.html">🏠 Accueil</a>
            <a href="bilan.html">📊 Bilan Annuel</a>
            <a href="mois.html?mois=janvier" class="active">📅 Janvier</a>
            <a href="mois.html?mois=fevrier">📅 Février</a>
            <a href="mois.html?mois=mars">📅 Mars</a>
            <a href="mois.html?mois=avril">📅 Avril</a>
            <a href="mois.html?mois=mai">📅 Mai</a>
            <a href="mois.html?mois=juin">📅 Juin</a>
            <a href="mois.html?mois=juillet">📅 Juillet</a>
            <a href="mois.html?mois=aout">📅 Août</a>
            <a href="mois.html?mois=septembre">📅 Septembre</a>
            <a href="mois.html?mois=octobre">📅 Octobre</a>
            <a href="mois.html?mois=novembre">📅 Novembre</a>
            <a href="mois.html?mois=decembre">📅 Décembre</a>
        </div>

        <!-- Contenu -->
        <div class="panel">
            <div class="panel-header">
                <h2 id="moisTitle">📅 Janvier 2026</h2>
                <div>
                    <span class="badge" id="moisStaffBadge">Staff: 15 moniteurs</span>
                </div>
            </div>

            <!-- Totaux du mois -->
            <div style="margin-bottom: 15px; padding: 10px; background: #e8f4fc; border-radius: 6px; border: 1px solid #bdc3c7;">
                <h3 style="margin-bottom: 8px; color: #2c3e50;">📊 Totaux du mois : 
                    <span id="totalP" style="color: #27ae60; font-weight: bold;">0h</span> (P) / 
                    <span id="totalR" style="color: #e74c3c; font-weight: bold;">0h</span> (R) / 
                    <span id="totalDiff" style="color: #f39c12; font-weight: bold;">0h</span> (Diff)
                </h3>
            </div>

            <div class="table-wrap" id="moisTableWrap"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        // ========== DONNÉES DIRECTEMENT DANS LE CODE ==========
        const MONTHS = ['janvier', 'fevrier', 'mars', 'avril', 'mai', 'juin', 'juillet', 'aout', 'septembre', 'octobre', 'novembre', 'decembre'];
        const MONTH_LABELS = ['Janvier', 'Février', 'Mars', 'Avril', 'Mai', 'Juin', 'Juillet', 'Août', 'Septembre', 'Octobre', 'Novembre', 'Décembre'];
        
        // Configuration par défaut
        const config = {
            year: 2026,
            club: 'ASPTT Voile',
            staff: ['Romain', 'Thibau', 'James', 'Swann', 'Soen', 'Cenzo', 'Marine', 'Léa', 'Erwan', 'Marin', 'Marie', 'Nils', 'Florian', 'Iris', 'Mael'],
            activities: ['ACCUEIL', 'EDV', 'EDS', 'ATELIER', 'GROUPE', 'CP', 'LOCATION', 'REPOS', 'REUNION', 'SCOLAIRE', 'AUTRE', 'RTQ', 'RTQ+EDS', 'EDV+CP', 'ATELIER+CP', 'GROUPE+CP', 'ACCUEIL+CP', 'EDV+GP', 'EDS+AT', 'ATELIER+GP', 'GROUPE+AT', 'CONGES', 'SCOLAIRE+CP']
        };

        // Données du mois (générées dynamiquement)
        let monthData = [];
        let currentMonth = 'janvier';

        // Générer les options pour les heures (0 à 12 par pas de 0.5)
        function generateHourOptions(selectedValue) {
            let options = '';
            for (let h = 0; h <= 12; h += 0.5) {
                const value = h.toFixed(1);
                const display = h % 1 === 0 ? h.toFixed(0) : h.toFixed(1);
                options += `<option value="${value}" ${selectedValue === value ? 'selected' : ''}>${display}</option>`;
            }
            return options;
        }

        // Calculer la différence
        function getDiff(P, R) {
            return (P || 0) - (R || 0);
        }

        // Générer les données pour un mois
        function generateMonthData(monthIdx, year, staff) {
            const daysInMonth = new Date(year, monthIdx + 1, 0).getDate();
            const data = [];
            
            for (let day = 1; day <= daysInMonth; day++) {
                const date = new Date(year, monthIdx, day);
                const dateStr = date.toISOString().split('T')[0];
                const dayName = date.toLocaleDateString('fr-FR', { weekday: 'long' });
                const weekNum = getISOWeekNumber(dateStr);
                
                const row = {
                    date: dateStr,
                    day: dayName,
                    week: weekNum,
                    staff: {}
                };
                
                staff.forEach(name => {
                    row.staff[name] = {
                        activity: 'ACCUEIL',
                        P: 0,
                        R: 0
                    };
                });
                
                data.push(row);
            }
            return data;
        }

        // Calculer le numéro de semaine ISO
        function getISOWeekNumber(dateStr) {
            const date = new Date(dateStr + 'T00:00:00');
            const dateCopy = new Date(date.getFullYear(), date.getMonth(), date.getDate());
            const dayNum = dateCopy.getDay() || 7;
            dateCopy.setDate(dateCopy.getDate() - dayNum + 4);
            const yearStart = new Date(dateCopy.getFullYear(), 0, 1);
            return Math.ceil((((dateCopy - yearStart) / 86400000) + 1) / 7);
        }

        // Mettre à jour la navigation
        function updateNav() {
            document.querySelectorAll('.nav-tabs a').forEach(a => {
                const href = a.getAttribute('href');
                if (href && href.includes(`mois=${currentMonth}`)) {
                    a.classList.add('active');
                } else {
                    a.classList.remove('active');
                }
            });
        }

        // Construire le tableau
        function buildTable() {
            const staff = config.staff;
            const monthIdx = MONTHS.indexOf(currentMonth);
            const monthLabel = MONTH_LABELS[monthIdx];
            
            document.getElementById('moisTitle').textContent = `📅 ${monthLabel} ${config.year}`;
            document.getElementById('moisStaffBadge').textContent = `Staff: ${staff.length} moniteurs`;
            
            // Générer les données si vide
            if (monthData.length === 0) {
                monthData = generateMonthData(monthIdx, config.year, staff);
            }
            
            // Calculer les totaux
            let totalP = 0, totalR = 0, totalDiff = 0;
            const staffTotals = {};
            staff.forEach(name => {
                staffTotals[name] = { P: 0, R: 0, Diff: 0 };
            });
            
            monthData.forEach(row => {
                staff.forEach(name => {
                    const cell = row.staff[name];
                    const p = cell.P || 0;
                    const r = cell.R || 0;
                    const diff = getDiff(p, r);
                    
                    staffTotals[name].P += p;
                    staffTotals[name].R += r;
                    staffTotals[name].Diff += diff;
                    
                    totalP += p;
                    totalR += r;
                    totalDiff += diff;
                });
            });
            
            // Mettre à jour les totaux
            document.getElementById('totalP').textContent = `${totalP.toFixed(1)}h`;
            document.getElementById('totalR').textContent = `${totalR.toFixed(1)}h`;
            document.getElementById('totalDiff').textContent = `${totalDiff.toFixed(1)}h`;
            
            // Construire le HTML du tableau
            let html = `<table>
                <thead>
                    <tr>
                        <th rowspan="2">Date</th>
                        <th rowspan="2">Jour</th>
                        <th rowspan="2">Sem.</th>`;
            
            // En-tête pour chaque moniteur
            staff.forEach(name => {
                html += `<th colspan="4">${name}</th>`;
            });
            
            html += `<th rowspan="2" style="min-width:28px;">✕</th></tr>
                    <tr>`;
            
            // Deuxième ligne d'en-tête
            staff.forEach(name => {
                html += `<th>Activité</th><th>P</th><th>R</th><th>Diff</th>`;
            });
            html += `</tr>
                </thead>
                <tbody>`;
            
            // Lignes pour chaque jour
            monthData.forEach((row, rowIndex) => {
                const dateObj = new Date(row.date + 'T00:00:00');
                const dateStr = dateObj.toLocaleDateString('fr-FR');
                const isDimanche = row.day === 'dimanche';
                const rowClass = isDimanche ? 'dimanche-row' : '';
                
                html += `<tr data-rowindex="${rowIndex}" class="${rowClass}">
                    <td>${dateStr}</td>
                    <td>${row.day || ''}</td>
                    <td>${row.week || ''}</td>`;
                
                // Cellules pour chaque moniteur
                staff.forEach(name => {
                    const cell = row.staff[name];
                    const diffVal = getDiff(cell.P, cell.R);
                    let diffClass = 'diff-zero';
                    if (diffVal > 0) diffClass = 'diff-positive';
                    else if (diffVal < 0) diffClass = 'diff-negative';
                    
                    let rColor = '';
                    if (cell.R > cell.P) rColor = '#f8d7da';
                    else if (cell.R < cell.P) rColor = '#d4edda';
                    else rColor = '#fff3cd';
                    
                    // Options pour P et R
                    const pOptions = generateHourOptions(cell.P || 0);
                    const rOptions = generateHourOptions(cell.R || 0);
                    
                    html += `
                        <td>
                            <select class="activity-select" onchange="updateActivity(${rowIndex}, '${name}', this.value)">
                                ${config.activities.map(a => 
                                    `<option value="${a}" ${cell.activity === a ? 'selected' : ''}>${a}</option>`
                                ).join('')}
                            </select>
                        </td>
                        <td>
                            <select class="hour-select" onchange="updateHour(${rowIndex}, '${name}', 'P', this.value)">
                                ${pOptions}
                            </select>
                        </td>
                        <td>
                            <select class="hour-select" onchange="updateHour(${rowIndex}, '${name}', 'R', this.value)" style="background:${rColor};">
                                ${rOptions}
                            </select>
                        </td>
                        <td class="${diffClass}">${diffVal.toFixed(1)}</td>`;
                });
                
                html += `<td>
                    <button onclick="deleteRow(${rowIndex})" style="background:none;border:none;color:#e74c3c;cursor:pointer;font-size:1rem;">✕</button>
                </td></tr>`;
            });
            
            // Ligne des totaux
            html += `<tr class="total-row">
                <td colspan="3">Total mois</td>`;
            staff.forEach(name => {
                const t = staffTotals[name];
                const diffClass = t.Diff > 0 ? 'diff-positive' : t.Diff < 0 ? 'diff-negative' : 'diff-zero';
                html += `<td></td><td>${t.P.toFixed(1)}</td><td>${t.R.toFixed(1)}</td><td class="${diffClass}">${t.Diff.toFixed(1)}</td>`;
            });
            html += `<td></td></tr>
                </tbody>
            </table>`;
            
            document.getElementById('moisTableWrap').innerHTML = html;
        }

        // Mettre à jour une activité
        function updateActivity(rowIndex, staffName, activity) {
            monthData[rowIndex].staff[staffName].activity = activity;
            buildTable();
        }

        // Mettre à jour une heure
        function updateHour(rowIndex, staffName, field, value) {
            monthData[rowIndex].staff[staffName][field] = parseFloat(value) || 0;
            buildTable();
        }

        // Supprimer une ligne
        function deleteRow(rowIndex) {
            if (confirm('⚠️ Supprimer la ligne du ' + monthData[rowIndex].date + ' ?')) {
                monthData.splice(rowIndex, 1);
                buildTable();
            }
        }

        // Initialisation
        const params = new URLSearchParams(window.location.search);
        currentMonth = params.get('mois') || 'janvier';
        
        // Générer les données pour le mois
        const monthIdx = MONTHS.indexOf(currentMonth);
        monthData = generateMonthData(monthIdx, config.year, config.staff);
        
        // Construire le tableau
        buildTable();
        updateNav();
    </script>
</body>
</html>
