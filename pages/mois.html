<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planning 2026 - Mois</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Navigation -->
        <div class="nav-tabs">
            <a href="../index.html">⚙️ Paramètres</a>
            <a href="bilan.html">📊 Bilan</a>
            <a href="mois.html?mois=janvier">📅 Janv</a>
            <a href="mois.html?mois=fevrier">📅 Fév</a>
            <a href="mois.html?mois=mars">📅 Mar</a>
            <a href="mois.html?mois=avril">📅 Avr</a>
            <a href="mois.html?mois=mai">📅 Mai</a>
            <a href="mois.html?mois=juin">📅 Juin</a>
            <a href="mois.html?mois=juillet">📅 Juil</a>
            <a href="mois.html?mois=aout">📅 Août</a>
            <a href="mois.html?mois=septembre">📅 Sep</a>
            <a href="mois.html?mois=octobre">📅 Oct</a>
            <a href="mois.html?mois=novembre">📅 Nov</a>
            <a href="mois.html?mois=decembre">📅 Déc</a>
        </div>

        <!-- Contenu -->
        <div class="panel">
            <div class="panel-header">
                <h2 id="moisTitle">📅 Janvier 2026</h2>
                <div>
                    <span class="badge" id="moisStaffBadge">Staff: -</span>
                    <button class="btn btn-sm btn-outline" id="addStaffActivityBtn">+ Activité</button>
                </div>
            </div>
            
            <div class="table-wrap" id="moisTableWrap"></div>
            
            <div class="weekly-summary">
                <h3>📅 Bilan hebdomadaire par moniteur</h3>
                <p>Heures prévues / réalisées / écart. Ce bilan se met à jour automatiquement.</p>
                <div class="table-wrap" id="weeklySummaryWrap"></div>
            </div>
            
            <div style="margin-top: 16px; display: flex; gap: 12px; flex-wrap: wrap;">
                <button class="btn btn-sm" id="saveMonthBtn">💾 Sauvegarder</button>
                <button class="btn btn-sm btn-outline" id="resetMonthBtn">🔄 Réinitialiser le mois</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../js/app.js"></script>
    <script>
        // --- LOGIQUE DE LA PAGE MOIS ---
        
        // Rendre le mois
        function renderMonth(monthKey) {
            App.currentMonth = monthKey;
            const monthIdx = MONTHS.indexOf(monthKey);
            if (monthIdx === -1) return;
            
            const monthLabel = MONTH_LABELS[monthIdx];
            const year = App.config.year;
            const staff = App.config.staff;
            
            document.getElementById('moisTitle').textContent = `📅 ${monthLabel} ${year}`;
            document.getElementById('moisStaffBadge').textContent = `Staff: ${staff.join(', ')}`;
            
            // Récupérer les données
            let data = App.getMonthData(monthKey);
            
            // Si les données sont vides, les générer
            if (!data || data.length === 0) {
                data = App.generateMonthData(monthIdx);
                App.data.months[monthKey] = data;
                App.saveData();
            }
            
            buildTable(data, staff, monthKey);
            buildWeeklySummary(data, staff);
            updateNav();
        }
        
        // Mettre à jour la navigation
        function updateNav() {
            document.querySelectorAll('.nav-tabs a').forEach(a => {
                const href = a.getAttribute('href');
                if (href && href.includes(`mois=${App.currentMonth}`)) {
                    a.classList.add('active');
                } else {
                    a.classList.remove('active');
                }
            });
        }
        
        // Construire le tableau
        function buildTable(data, staff, monthKey) {
            if (!staff || staff.length === 0) {
                document.getElementById('moisTableWrap').innerHTML = 
                    '<p style="color:red;padding:20px;">Erreur: Aucun moniteur configuré. Veuillez vérifier les paramètres.</p>';
                return;
            }
            
            // Options pour les heures (0 à 12 par pas de 0.5)
            let hourOptions = '';
            for (let h = 0; h <= 12; h += 0.5) {
                hourOptions += `<option value="${h}">${h.toFixed(1)}</option>`;
            }
            
            let html = `<table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Jour</th>
                        <th>Sem.</th>`;
            
            // Colonnes pour chaque moniteur
            staff.forEach(name => {
                html += `<th>${name}<br><span style="font-weight:400;font-size:0.55rem;">Act. / P / R / D</span></th>`;
            });
            
            html += `<th style="min-width:28px;">🗑️</th></tr>
                </thead>
                <tbody>`;
            
            // Lignes pour chaque jour
            data.forEach((row, rowIndex) => {
                const dateObj = new Date(row.date + 'T00:00:00');
                const dateStr = dateObj.toLocaleDateString('fr-FR');
                const isDimanche = row.day === 'dimanche';
                const rowClass = isDimanche ? 'dimanche-row' : '';
                
                html += `<tr data-rowindex="${rowIndex}" class="${rowClass}">
                    <td>${dateStr}</td>
                    <td>${row.day || ''}</td>
                    <td>${row.week || ''}</td>`;
                
                // Cellules pour chaque moniteur
                staff.forEach(name => {
                    const cell = row.staff[name] || { activity: 'ACCUEIL', P: 0, R: 0 };
                    const diffVal = (cell.P || 0) - (cell.R || 0);
                    let diffClass = 'diff-zero';
                    if (diffVal > 0) diffClass = 'diff-positive';
                    else if (diffVal < 0) diffClass = 'diff-negative';
                    
                    let rColor = '';
                    if (cell.R > cell.P) rColor = '#f8d7da';
                    else if (cell.R < cell.P) rColor = '#d4edda';
                    else rColor = '#fff3cd';
                    
                    html += `<td>
                        <div class="staff-activity-cell">
                            <select class="activity-select" data-row="${rowIndex}" data-staff="${name}" style="width:100%;max-width:75px;">
                                ${App.config.activities.map(a => 
                                    `<option value="${a}" ${cell.activity === a ? 'selected' : ''}>${a}</option>`
                                ).join('')}
                            </select>
                            <div class="hours-row">
                                <input type="number" class="hour-input p-input" data-row="${rowIndex}" data-staff="${name}" data-field="P" 
                                       value="${cell.P || 0}" step="0.5" min="0" max="12" style="width:48px;text-align:center;">
                                <span style="font-weight:300;color:#999;">/</span>
                                <input type="number" class="hour-input r-input" data-row="${rowIndex}" data-staff="${name}" data-field="R" 
                                       value="${cell.R || 0}" step="0.5" min="0" max="12" style="width:48px;text-align:center;background:${rColor};">
                                <span class="diff-cell ${diffClass}" data-row="${rowIndex}" data-staff="${name}">${diffVal.toFixed(1)}</span>
                            </div>
                        </div>
                    </td>`;
                });
                
                html += `<td>
                    <button class="delete-row-btn" style="background:none;border:none;color:#b91c1c;cursor:pointer;font-size:0.9rem;" 
                            data-row="${rowIndex}">✕</button>
                </td></tr>`;
            });
            
            // Ligne des totaux
            const { totals, staffTotals } = App.calculateMonthTotals(monthKey);
            html += `<tr class="month-header">
                <td colspan="3">Total mois</td>`;
            staff.forEach(name => {
                const t = staffTotals[name];
                html += `<td>${(t.P || 0).toFixed(1)} / ${(t.R || 0).toFixed(1)} / ${(t.Diff || 0).toFixed(1)}</td>`;
            });
            html += `<td></td></tr>
                </tbody>
            </table>`;
            
            document.getElementById('moisTableWrap').innerHTML = html;
        }
        
        // Construire le résumé hebdomadaire
        function buildWeeklySummary(data, staff) {
            const weeks = [...new Set(data.map(r => r.week))].sort((a,b) => a-b);
            let summary = '<table><thead><tr><th>Moniteur</th>';
            
            weeks.forEach(w => {
                summary += `<th>Semaine ${w}<br><small>P / R / Écart</small></th>`;
            });
            summary += '<th>Total du mois<br><small>P / R / Écart</small></th></tr></thead><tbody>';
            
            staff.forEach(name => {
                let tp = 0, tr = 0;
                summary += `<tr><td><strong>${name}</strong></td>`;
                
                weeks.forEach(w => {
                    let p = 0, r = 0;
                    data.filter(row => row.week === w).forEach(row => {
                        const cell = row.staff?.[name];
                        p += cell?.P || 0;
                        r += cell?.R || 0;
                    });
                    tp += p; tr += r;
                    const d = p - r;
                    const cls = d > 0 ? 'diff-positive' : d < 0 ? 'diff-negative' : 'diff-zero';
                    summary += `<td>${p.toFixed(1)} / ${r.toFixed(1)} / <span class="${cls}">${d.toFixed(1)}</span></td>`;
                });
                
                const d = tp - tr;
                const cls = d > 0 ? 'diff-positive' : d < 0 ? 'diff-negative' : 'diff-zero';
                summary += `<td><strong>${tp.toFixed(1)} / ${tr.toFixed(1)} / <span class="${cls}">${d.toFixed(1)}</span></strong></td></tr>`;
            });
            
            summary += '</tbody></table>';
            document.getElementById('weeklySummaryWrap').innerHTML = summary;
        }
        
        // Ajouter une activité
        function addActivity() {
            const newAct = prompt('Nouvelle activité à ajouter :');
            if (newAct && newAct.trim() !== '') {
                const act = newAct.trim().toUpperCase();
                if (!App.config.activities.includes(act)) {
                    App.config.activities.push(act);
                    App.saveConfig();
                    renderMonth(App.currentMonth);
                } else {
                    alert('Cette activité existe déjà.');
                }
            }
        }
        
        // Boutons
        document.getElementById('saveMonthBtn')?.addEventListener('click', () => {
            App.saveData(false);
            alert('Mois sauvegardé !');
        });
        
        document.getElementById('resetMonthBtn')?.addEventListener('click', () => {
            if (confirm(`Réinitialiser le mois ${MONTH_LABELS[MONTHS.indexOf(App.currentMonth)]} ?`)) {
                App.resetMonth(App.currentMonth);
                renderMonth(App.currentMonth);
                alert('Mois réinitialisé !');
            }
        });
        
        document.getElementById('addStaffActivityBtn')?.addEventListener('click', addActivity);
        
        // Initialisation
        const params = new URLSearchParams(window.location.search);
        const monthKey = params.get('mois') || 'janvier';
        App.init().then(() => {
            renderMonth(monthKey);
        });
        
        // Exposer la fonction pour app.js
        window.renderMonth = renderMonth;
    </script>
</body>
</html>
